
name: Build KernelSU VPN ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake unzip zip curl file

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION=27.2.12479018
          NDK_ARCHIVE=android-ndk-r27d-linux.zip

          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/${NDK_ARCHIVE}" \
            -o "$RUNNER_TEMP/$NDK_ARCHIVE"

          unzip -q "$RUNNER_TEMP/$NDK_ARCHIVE" \
            -d "$RUNNER_TEMP"

          mkdir -p "$ANDROID_HOME/ndk"
          mv "$RUNNER_TEMP/android-ndk-r27d" \
            "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: Build Go VPN engine
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p bin
          go mod tidy
          go build -trimpath \
            -ldflags="-s -w" \
            -o bin/vpn-engine \
            ./cmd/vpn-engine

      - name: Build redsocks ARM64
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC="$TC/aarch64-linux-android24-clang"
          export AR="$TC/llvm-ar"
          export RANLIB="$TC/llvm-ranlib"

          mkdir -p build bin
          unzip -q libs/redsocks.zip -d build

          curl -fL --retry 3 \
            https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz \
            -o build/libevent.tar.gz

          tar -xzf build/libevent.tar.gz -C build

          cmake -S build/libevent-2.1.12-stable \
            -B build/libevent-out \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVENT__DISABLE_OPENSSL=ON \
            -DEVENT__DISABLE_TESTS=ON \
            -DEVENT__DISABLE_SAMPLES=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/libevent-install"

          cmake --build build/libevent-out \
            --target install -j2

          cd build/redsocks

          printf '#define USE_IPTABLES\n' > config.h
          mkdir -p gen

          printf '#include "../version.h"\nconst char* redsocks_version = "redsocks/android";\n' \
            > gen/version.c

          export CFLAGS="-O2 -fPIE -I$PWD/../libevent-install/include"
          export LDFLAGS="-pie -L$PWD/../libevent-install/lib"

          make -j2 \
            CC="$CC" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            LIBS="-levent_core"

          cp redsocks ../../bin/redsocks

      - name: Build dns2socks ARM64
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          mkdir -p build bin
          unzip -q libs/dns2socks.zip -d build

          cd build/dns2socks

          "$CC" -O2 -fPIE -pie -pthread \
            dns2socks.c \
            -o ../../bin/dns2socks

      - name: Verify binaries
        run: |
          set -e
          chmod 755 bin/*
          file bin/*
          readelf -h bin/vpn-engine
          readelf -h bin/redsocks
          readelf -h bin/dns2socks

      - name: Package KernelSU module
        run: |
          set -e
          mkdir -p dist

          zip -r dist/HTTP-CUSTOM-HEADERS-VPN-KSU-arm64.zip \
            module.prop \
            customize.sh \
            service.sh \
            action.sh \
            uninstall.sh \
            scripts \
            vpn \
            cfgs \
            web \
            bin \
            README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTTP-CUSTOM-HEADERS-VPN-KSU-arm64
          path: dist/HTTP-CUSTOM-HEADERS-VPN-KSU-arm64.zip
          if-no-files-found: error
          
